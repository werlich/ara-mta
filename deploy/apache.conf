# Modelo. Exige proxy, proxy_http, ssl e headers habilitados.
# Integre ao virtual host existente, preservando outros domínios.
<VirtualHost *:80>
    ServerName ara-mta.signau.cc
    Redirect permanent / https://ara-mta.signau.cc/
</VirtualHost>
<VirtualHost *:443>
    ServerName ara-mta.signau.cc
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ara-mta.signau.cc/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ara-mta.signau.cc/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    ProxyAddHeaders On
    LimitRequestBody 32768
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
