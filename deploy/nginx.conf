# Modelo para integrar ao virtual host existente. NÃO substitua configurações
# de outros domínios. Ajuste os caminhos do certificado antes de nginx -t.
server {
    listen 80;
    server_name ara-mta.signau.cc;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ara-mta.signau.cc;
    ssl_certificate /etc/letsencrypt/live/ara-mta.signau.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ara-mta.signau.cc/privkey.pem;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
